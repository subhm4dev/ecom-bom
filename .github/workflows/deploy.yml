name: Publish BOM
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: github
          server-username: subhm4dev
          server-password: ${{ secrets.GITHUB_TOKEN }}
      - run: mvn -B deploy
